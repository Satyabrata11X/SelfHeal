spring:
  application:
    name: selfheal-demo-app

selfheal:
  enabled: true

  monitoring:
    interval: 5000
    latency-threshold: 1000

  recovery:
    strategy: retry
    max-attempts: 3
    delay: 1000
    backoff-multiplier: 2.0
    max-delay: 10000
    cooldown: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always